<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sara Ávila — Interactive Designer</title>
<meta name="description" content="Sara Ávila — Diseñadora interactiva y UX/UI en Bogotá. Interactive & UX/UI designer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2EFE8; --paper-2:#E9E5DA; --card:#FBFAF6; --ink:#1B1A16; --ink-2:#3B3A33; --muted:#77736A;
  --line:rgba(27,26,22,.12); --olive:#8F8C6E; --olive-d:#4F4D37; --olive-l:#D9D6C2; --signal:#D4E36A;
  --serif:'Instrument Serif',Georgia,serif; --sans:'Geist',system-ui,-apple-system,Segoe UI,sans-serif; --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.1,1); --glass:rgba(251,250,246,.74); --bar:rgba(242,239,232,.88); --deep:#1B1A16;
}
[data-theme=dark]{--paper:#11110F;--paper-2:#1D1C18;--card:#181714;--ink:#EEEBE3;--ink-2:#C9C5BA;--muted:#8E8A7F;--line:rgba(238,235,227,.12);--olive-d:#CFCC9E;--olive-l:#34332A;--glass:rgba(26,25,22,.74);--bar:rgba(17,17,15,.88);--deep:#1E1D19}
body{transition:background .5s,color .5s}
[data-theme=dark] .contact{background:#1A1916;color:var(--ink);border-top:1px solid var(--line)}
[data-theme=dark] .contact .mag{border-color:var(--line)}
[data-theme=dark] .card-obj .ph{box-shadow:0 18px 40px -18px rgba(0,0,0,.8)}
.theme{width:38px;height:38px;border-radius:50%;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);display:grid;place-items:center;transition:transform .5s var(--ease)}
.theme:hover{transform:rotate(180deg)}
.theme svg{width:16px;height:16px}
.right{display:flex;gap:8px;align-items:center}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;opacity:.35;mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 85%)}
/* image protection: no drag, no select, no long-press save, no pointer on images */
img,video{display:block;max-width:100%;-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}
.protect{position:relative}
.protect::after{content:"";position:absolute;inset:0;z-index:1}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto;position:relative;z-index:1}
::selection{background:var(--signal);color:var(--ink)}

/* header */
.top{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:99px;padding:9px 14px}
.brand b{font-weight:500}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--olive-d);box-shadow:0 0 0 3px var(--olive-l)}
.nav{display:flex;gap:2px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:99px;padding:4px}
.nav a{text-decoration:none;padding:8px 13px;border-radius:99px;transition:background .25s,color .25s;white-space:nowrap}
.nav a:hover,.nav a.on{background:var(--ink);color:var(--paper)}
.lang{display:flex;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:99px;padding:4px;position:relative}
.lang button{position:relative;z-index:1;padding:7px 11px;border-radius:99px;transition:color .3s}
.lang button.on{color:var(--ink)}
.lang .k{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:var(--signal);transition:transform .45s var(--ease)}
.lang[data-l="en"] .k{transform:translateX(100%)}

/* hero */
.hero{position:relative;height:100svh;min-height:600px;overflow:hidden;z-index:1;touch-action:pan-y}
.hero-copy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1000px,92vw);text-align:center;pointer-events:none;z-index:2}
.hello{color:var(--muted);margin-bottom:16px;display:inline-flex;gap:10px;align-items:center}
.hello::before,.hello::after{content:"";width:26px;height:1px;background:currentColor;opacity:.5}
.headline{font-family:var(--serif);font-weight:400;font-size:clamp(46px,8vw,120px);line-height:.92;letter-spacing:-.02em}
.headline em{font-style:italic;color:var(--olive-d)}
.headline .w{display:inline-block;white-space:nowrap}
.headline .ch{display:inline-block;transition:transform .5s var(--ease);will-change:transform}
.headline .ch.in{animation:rise 1s var(--ease) both}
@keyframes rise{from{transform:translateY(.6em) rotate(6deg);opacity:0}}
.sub{margin-top:18px;color:var(--ink-2)}
.hero-ui{position:absolute;left:20px;right:20px;bottom:20px;display:flex;justify-content:space-between;align-items:end;z-index:5;pointer-events:none}
.hero-ui>*{pointer-events:auto}
.hint{display:flex;align-items:center;gap:10px;color:var(--muted)}
.tools{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);transition:background .25s,color .25s}
.chip:hover{background:var(--ink);color:var(--paper)}
.card-obj{position:absolute;left:0;top:0;z-index:3;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform}
.card-obj:active{cursor:grabbing}
.card-obj .ph{background:var(--card);padding:7px 7px 0;border-radius:14px;box-shadow:0 18px 40px -18px rgba(40,36,20,.45),0 2px 6px rgba(40,36,20,.08);transition:box-shadow .3s,transform .3s var(--ease)}
.card-obj.drag .ph{box-shadow:0 40px 70px -24px rgba(40,36,20,.55);transform:scale(1.04)}
.card-obj img{border-radius:8px;object-fit:cover;background:#111;width:100%}
.card-obj .cap{display:flex;justify-content:space-between;gap:10px;padding:7px 3px 8px;color:var(--muted)}
.card-obj .cap b{color:var(--ink);font-weight:500}
.tape{position:absolute;top:-9px;left:50%;width:56px;height:18px;transform:translateX(-50%) rotate(-3deg);background:rgba(212,227,106,.8);mix-blend-mode:multiply;border-radius:2px;z-index:2}

/* sections */
section{position:relative;z-index:1}
.sec{padding:96px 0 40px}
.eyebrow{color:var(--muted);display:flex;gap:10px;align-items:center;margin-bottom:12px}
.eyebrow b{color:var(--ink);font-weight:500}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(40px,5.4vw,76px);line-height:.95;letter-spacing:-.02em;margin-bottom:32px}
h2 em{font-style:italic;color:var(--olive-d)}

/* experience grid */
.xgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.xcard{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.xcard:hover{transform:translateY(-5px);box-shadow:0 26px 50px -28px rgba(40,36,20,.45)}
.xmedia{position:relative;border-radius:11px;overflow:hidden;aspect-ratio:4/3;background:var(--c,#111)}
.hov{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:14px;color:#fff;background:linear-gradient(180deg,rgba(20,19,16,0) 30%,rgba(20,19,16,.88));opacity:0;transform:translateY(10px);transition:opacity .4s var(--ease),transform .5s var(--ease);pointer-events:none}
.hov b{font-weight:500;font-size:14px}.hov span{font-size:13px;line-height:1.35;opacity:.85}
.xcard:hover .hov,.acard:hover .hov,.it:hover .hov{opacity:1;transform:none}
@media (hover:none){.hov{opacity:1;transform:none;background:linear-gradient(180deg,rgba(20,19,16,0) 45%,rgba(20,19,16,.8))}.hov span{display:none}}
.xmedia>div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3%;padding:6%;transition:transform .9s var(--ease)}
.xcard:hover .xmedia>div{transform:scale(1.04)}
.xmedia img{max-height:100%;width:auto;border-radius:8px;box-shadow:0 18px 36px -12px rgba(0,0,0,.5)}
.xmedia .full{padding:0}.xmedia .full img{width:100%;height:100%;object-fit:cover;border-radius:0;box-shadow:none}
.xmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 6px 2px}
.xmeta .co{font-family:var(--serif);font-size:24px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--paper);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--pc,#5DB36A)}
.xline{display:none}
.xrole{padding:0 6px 6px;color:var(--muted)}
.go{position:absolute;right:14px;top:14px;z-index:2;width:44px;height:44px;border-radius:50%;background:var(--signal);display:grid;place-items:center;transform:scale(0);transition:transform .45s var(--ease)}
.xcard:hover .go{transform:scale(1)}

/* academic */
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:22px}
.tabs button{padding:9px 16px;border-radius:99px;transition:background .3s,color .3s}
.tabs button.on{background:var(--ink);color:var(--paper)}
.tabs button span{opacity:.55;margin-left:6px}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.acard{position:relative;display:flex;flex-direction:column;gap:10px;padding:8px 8px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;overflow:hidden;transition:transform .45s var(--ease),background .35s,color .35s;cursor:pointer;text-align:left}
.acard .cv{position:relative;aspect-ratio:767/600;border-radius:10px;overflow:hidden;background:var(--paper-2)}
.acard .cv img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.acard:hover .cv img{transform:scale(1.06)}
.acard .tx{padding:0 6px}
.acard:hover{transform:translateY(-4px) rotate(-.6deg);background:var(--ink);color:var(--paper)}
.acard .n{color:var(--muted);margin-bottom:4px}
.acard:hover .n,.acard:hover .t2{color:var(--olive-l)}
.acard .t1{font-family:var(--serif);font-size:22px;line-height:1.05}
.acard .t2{color:var(--muted);margin-top:4px;font-size:13px;transition:color .3s}
.acard>div{position:relative;z-index:1}
.acard .bh{display:flex;justify-content:space-between;align-items:center}
.fade{animation:fadeup .6s var(--ease) both}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}

/* about */
.about{display:grid;grid-template-columns:300px 1fr;gap:48px;align-items:start}
.arch{position:relative;aspect-ratio:3/4;border-radius:999px 999px 20px 20px;background:radial-gradient(circle at 50% 35%,#A9A688,var(--olive) 70%);overflow:hidden}
.arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.bio{font-family:var(--serif);font-size:clamp(26px,2.6vw,36px);line-height:1.12}
.bio em{font-style:italic;color:var(--olive-d)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:34px}
.cols h3{margin-bottom:10px;color:var(--muted);font-weight:400}
.xp{list-style:none}
.xp li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.xp li span:first-child{flex:1 1 auto;min-width:0}
.xp li span:last-child{flex:0 0 auto;color:var(--muted);font-family:var(--mono);font-size:12px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips span{padding:6px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;transition:transform .3s var(--ease),background .3s}
.chips span:hover{transform:translateY(-3px) rotate(-2deg);background:var(--signal)}

/* contact */
.contact{background:var(--ink);color:var(--paper);border-radius:28px 28px 0 0;padding:90px 0 34px;margin-top:80px}
.contact .big{font-family:var(--serif);font-size:clamp(64px,12vw,180px);line-height:.88;letter-spacing:-.03em}
.contact .big em{font-style:italic;color:var(--signal)}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:38px}
.mag{display:inline-flex;align-items:center;gap:10px;padding:14px 20px;border-radius:99px;border:1px solid rgba(242,239,232,.25);text-decoration:none;transition:background .3s,color .3s}
.mag:hover{background:var(--paper);color:var(--ink)}
.mag.primary{background:var(--signal);color:#1B1A16!important;border-color:transparent}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:80px;padding-top:20px;border-top:1px solid rgba(242,239,232,.15);color:rgba(242,239,232,.55)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:99px;z-index:200;transition:transform .5s var(--ease)}
.toast.on{transform:translate(-50%,0)}

/* case view */
.case{position:fixed;inset:0;z-index:100;background:var(--paper);overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .7s var(--ease);visibility:hidden}
.case.open{transform:none;visibility:visible}
.cbar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 20px;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.cbar .prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--ink);width:0}
.home{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;background:var(--ink);color:var(--paper)}
.ctabs{justify-self:center;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.ctabs::-webkit-scrollbar{display:none}
.ctabs a{padding:7px 12px;border-radius:99px;text-decoration:none;white-space:nowrap;transition:background .25s,color .25s}
.ctabs a.on,.ctabs a:hover{background:var(--ink);color:var(--paper)}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:16px}
.chead{padding:56px 0 8px}
.chead h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,6vw,84px);line-height:.95;letter-spacing:-.02em;max-width:16ch}
.chead h1 em{font-style:italic;color:var(--olive-d)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:30px;padding-top:16px;border-top:1px solid var(--ink)}
.facts div span{display:block;color:var(--muted);margin-bottom:4px}
.did{display:flex;flex-wrap:wrap;gap:7px;margin-top:22px}
.did span{padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px}
.nda{display:inline-flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--olive-l);margin-top:20px;font-size:14px;color:var(--ink-2)}
.chap{padding-top:54px}
.chap h3{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3vw,40px);line-height:1}
.chap h3 small{display:block;color:var(--muted);margin-bottom:8px}
.chap p{margin-top:10px;color:var(--ink-2);max-width:60ch}
.rail-wrap{position:relative;margin-top:20px}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:14px;cursor:grab;scrollbar-width:thin;scrollbar-color:var(--olive) transparent}
.rail:active{cursor:grabbing}
.rail .it{position:relative;flex:0 0 auto;height:var(--h,280px);scroll-snap-align:start;border-radius:14px;overflow:hidden;background:var(--bg,transparent);opacity:0;transform:translateX(60px) scale(.94);transition:opacity .7s var(--ease),transform .9s var(--ease),box-shadow .4s;will-change:transform}
.rail.in .it{opacity:1;transform:translateX(0) scale(var(--sc,1)) translateY(var(--ty,0))}
.rail.in .it:hover{box-shadow:0 22px 40px -22px rgba(40,36,20,.55)}
.rail .it .hov{border-radius:14px}
.rail .it.card{background:var(--card);border:1px solid var(--line)}
.rail .it.dark{background:#141414}
.rail .it img{height:100%;width:auto;max-width:none}
.rail .it.pad{padding:16px}
.rail .it.pad img{border-radius:6px}
.arrows{position:absolute;right:0;top:-48px;display:flex;gap:6px}
.arrows button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);transition:background .25s,color .25s}
.arrows button:hover{background:var(--ink);color:var(--paper)}
.method{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.method span{padding:6px 11px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:13.5px}
.flow{margin-top:20px;background:var(--ink);color:var(--paper);border-radius:18px;padding:20px}
.flow .tog{display:inline-flex;background:rgba(242,239,232,.08);border-radius:99px;padding:4px;position:relative}
.flow .tog button{position:relative;z-index:1;padding:8px 16px;border-radius:99px;transition:color .3s}
.flow .tog .knob{position:absolute;top:4px;bottom:4px;left:4px;border-radius:99px;background:var(--signal);transition:transform .5s var(--ease),width .5s var(--ease)}
.flow .tog button.on{color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.step{border:1px solid rgba(242,239,232,.16);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.step .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:rgba(242,239,232,.5);text-transform:uppercase}
.step p{font-size:14.5px;line-height:1.35;margin:0;color:var(--paper)}
.step.hot{background:rgba(212,227,106,.12);border-color:rgba(212,227,106,.5)}
.flow.after .step{animation:fadeup .5s var(--ease) both}
.flow.after .step:nth-child(2){animation-delay:.07s}.flow.after .step:nth-child(3){animation-delay:.14s}.flow.after .step:nth-child(4){animation-delay:.21s}
.vids{display:flex;gap:14px;overflow-x:auto;margin-top:20px;padding-bottom:12px}
.vid{flex:0 0 auto;position:relative;border-radius:14px;overflow:hidden;width:220px;aspect-ratio:9/16;background:#111;display:block;text-decoration:none;color:#fff;cursor:pointer}
.vid img,.vid video,.vid iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.vid iframe{pointer-events:auto}
.vid::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.75));pointer-events:none}
.vid .play{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(251,250,246,.92);display:grid;place-items:center;z-index:2;transition:transform .4s var(--ease)}
.vid:hover .play{transform:scale(1.12)}
.vid .vm{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;font-size:12.5px;line-height:1.3}
.vid .vm .mono{display:block;font-size:10px;opacity:.8;margin-top:4px}
.vid.live::after,.vid.live .play,.vid.live .vm{display:none}
.vid.wide{aspect-ratio:16/9;width:390px;cursor:default}
.stats{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.stat{padding:14px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:44px;line-height:1}
.stat span{color:var(--muted)}
.cnext{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:60px 0 90px;padding-top:22px;border-top:1px solid var(--ink)}
.cnext a{text-decoration:none}
.cnext .serif{text-transform:none;letter-spacing:-.01em;font-family:var(--serif);font-size:clamp(32px,4.4vw,60px);line-height:1;transition:transform .5s var(--ease);display:inline-block}
.cnext a:hover .serif{transform:translateX(10px)}
.cnext .serif em{font-style:italic;color:var(--olive-d)}

/* cover ring */
.ring{position:relative;height:clamp(380px,48vw,470px);perspective:1500px;user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:grab;margin-top:6px}

    const dio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting||reduce)return;dio.disconnect();let t0=performance.now();(function anim(t){const p=Math.min(1,(t-t0)/2200);const v=50+Math.sin(p*Math.PI*2)*28*(1-p);inp.value=v;set(v);if(p<1)requestAnimationFrame(anim)})(t0)}),{root:caseEl,threshold:.6});dio.observe(cm)}
}

/* ---------- behance modal ---------- */
function openBh(a,g){const url=`https://www.behance.net/gallery/${a[0]}/project`;$('#bmT').textContent=tr(a[1]);$('#bmD').textContent=tr(a[3]);$('#bmK').textContent=tr(g==='team'?T.team_l:T.ind_l);$('#bmL').href=url;$('#bmL').textContent=tr(T.view);
  $('#bmF').innerHTML=canEmbed?`<iframe src="https://www.behance.net/embed/project/${a[0]}?ilo0=1" allowfullscreen loading="lazy" allow="clipboard-write" referrerpolicy="strict-origin-when-cross-origin" title="${tr(a[1])}"></iframe>`:`<img src="img/bh-${a[0]}.webp" alt="">`;$('#bm').classList.add('on')}
const closeBm=()=>{$('#bm').classList.remove('on');$('#bmF').innerHTML=''};
$('#bmX').onclick=closeBm;$('#bm').addEventListener('click',e=>{if(e.target.id==='bm')closeBm()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeBm()});
/* ---------- protection: no context menu / zoom on images ---------- */
document.addEventListener('contextmenu',e=>{if(e.target.closest('img,video,.protect,.rail,.xmedia,.card-obj,.vid'))e.preventDefault()});
document.addEventListener('dragstart',e=>{if(e.target.tagName==='IMG')e.preventDefault()});
addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault()});
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
let lastT=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastT<300)e.preventDefault();lastT=n},{passive:false});

/* ---------- cursor + copy ---------- */
if(!touch){const cur=$('#cur'),ct=$('#curT');let cx=0,cy=0,tx=0,ty=0;
  addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;const t=e.target.closest('[data-cur],.card-obj,.vid,.rail,.rc,.cmp,.hs-track');if(t){cur.classList.add('big');ct.textContent=t.classList.contains('card-obj')?(L==='es'?'arrastra':'drag'):t.classList.contains('vid')?'play':t.classList.contains('rc')?(t.classList.contains('front')?(L==='es'?'abrir':'open'):(L==='es'?'girar':'spin')):t.classList.contains('cmp')?'⇆':t.classList.contains('hs-track')?'scroll':t.classList.contains('rail')?(L==='es'?'desliza':'swipe'):t.dataset.cur}else cur.classList.remove('big')});
  (function m(){cx+=(tx-cx)*.2;cy+=(ty-cy)*.2;cur.style.transform=`translate(${cx}px,${cy}px)`;requestAnimationFrame(m)})()}
$('#copyMail').onclick=async()=>{const m='saraavilavalencia1@gmail.com';try{await navigator.clipboard.writeText(m);const t=$('#toast');t.textContent=tr(T.copied);t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}catch(e){location.href='mailto:'+m}};

renderStatic(); route();
})();
